<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Quejas</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .mensaje {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .exito {
            color: green;
        }

        .error {
            color: red;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Formulario de Quejas</h2>

    <form id="formQuejas">

        <label>Nombre:</label>
        <input
            type="text"
            id="nombre"
            required
        >

        <label>Email:</label>
        <input
            type="email"
            id="email"
            required
        >

        <label>Tipo de queja:</label>
        <select id="tipo">

            <option value="General">
                General
            </option>

            <option value="Servicio">
                Servicio
            </option>

            <option value="Urgente">
                Urgente
            </option>

        </select>

        <label>Mensaje:</label>
        <textarea
            id="mensaje"
            required
        ></textarea>

        <button type="submit">
            Enviar Queja
        </button>

    </form>

    <div id="resultado" class="mensaje"></div>

</div>

<script>

const formulario =
document.getElementById("formQuejas");

formulario.addEventListener(
"submit",
function(e) {

    e.preventDefault();

    const resultado =
    document.getElementById("resultado");

    resultado.innerHTML =
    "Enviando...";

    fetch(
        "https://printanier-nonfamiliarly-anne.ngrok-free.dev/webhook/quejas",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                nombre:
                document.getElementById("nombre").value,

                email:
                document.getElementById("email").value,

                tipo:
                document.getElementById("tipo").value,

                mensaje:
                document.getElementById("mensaje").value

            })

        }
    )

    .then(function(response) {

        if (!response.ok) {
            throw new Error("Error en la solicitud");
        }

        return response.json();

    })

    .then(function(data) {

        resultado.className =
        "mensaje exito";

        resultado.innerHTML =
        "Queja enviada correctamente";

        formulario.reset();

    })

    .catch(function(error) {

        resultado.className =
        "mensaje error";

        resultado.innerHTML =
        "Error al enviar la queja";

        console.error(error);

    });

});

</script>

</body>

</html>
